services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: bazak
      POSTGRES_USER: bazak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bazak_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bazak", "-d", "bazak"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
